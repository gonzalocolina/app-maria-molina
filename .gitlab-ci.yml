# GitLab Pages deployment configuration
# This pipeline deploys the privacy policy page to GitLab Pages

# Use the official Docker image for static sites
image: alpine:latest

# Define the stages
stages:
  - deploy

# GitLab Pages job - must be named exactly "pages"
pages:
  stage: deploy
  script:
    - echo "Deploying Privacy Policy to GitLab Pages..."
    - echo "Contents of public directory:"
    - ls -la public/
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    # Deploy on pushes to main/master branch
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_BRANCH == "master"
      when: always
    # Also allow manual deployment from other branches
    - when: manual
      allow_failure: true
  environment:
    name: production
    url: https://goncoli.pages.gitlab.inf.uva.es/edunovamariamolina

